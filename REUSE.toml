version = 1

# REUSE (https://reuse.software) compliance for trentpower.fr, declared in bulk so
# source files stay clean (no per-file SPDX headers). Annotations are evaluated with
# last-match-wins precedence, so the specific overrides below the default take effect.
#
# Licensing map (see NOTICE.md):
#   code + tooling + generated machine data ... MIT
#   authored prose + editorial content/images . CC-BY-SA-4.0
#   bundled open-source fonts (frozen archive) . OFL-1.1
#   author likeness / identity assets ......... LicenseRef-trentpower-personal (no open licence)

# ── default: everything is MIT unless overridden below ──────────────────────
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Trent Power"
SPDX-License-Identifier = "MIT"

# ── authored prose + editorial content → CC-BY-SA-4.0 ───────────────────────
[[annotations]]
path = [
  "content/**",
  "docs/**/*.md",
  "*.md",
  "README.pdf",
  "CITATION.cff",
  "public/**/*.html",
  "public/source/**/*.html.txt",
  "public/images/textures/**",
  "public/images/og/**",
  "public/source/images/textures/**",
  "public/source/images/og/**",
  "docs/pdf/assets/**",
  "docs/pdf/**/*.svg",
  "metadata/social-preview/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Trent Power"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# ── bundled open-source fonts in the frozen 2026-02 release → OFL-1.1 ────────
[[annotations]]
path = "public/integrity/releases/2026-02/**/*.woff2"
precedence = "override"
SPDX-FileCopyrightText = [
  "Copyright IBM Corporation, with Reserved Font Name 'Plex'",
  "Copyright The Newsreader Project Authors (https://github.com/productiontype/newsreader)",
]
SPDX-License-Identifier = "OFL-1.1"

# ── author likeness / identity assets → no open licence ─────────────────────
[[annotations]]
path = [
  "public/images/portraits/**",
  "public/source/images/portraits/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Trent Power — all rights reserved"
SPDX-License-Identifier = "LicenseRef-trentpower-personal"
