hero:
  statement: Stratégie client,<br><mark>systèmes de croissance</mark><br>et adoption culturelle<br>à l’échelle mondiale.
  body: |-
    Je pilote la stratégie client au niveau du Groupe, en me concentrant sur les systèmes,
    la gouvernance et les façons de travailler qui transforment les relations clients en
    valeur à long terme. Mon travail se situe à l’intersection de la stratégie, de la
    technologie et des relations humaines, avec un impact qui se déploie à grande échelle
    et dans la durée.
approach:
  label: Approche
  growth_title: La croissance client exige une discipline
  growth_body: Une croissance durable repose sur des systèmes élégants.
  clienteling_title: Le clienteling transforme la transaction en sens
  clienteling_detail: Le <dfn id="clienteling-definition" itemprop="name">clienteling</dfn><meta itemprop="url" content="https://trentpower.fr/fr/#clienteling-definition"> <span itemprop="description">est la pratique disciplinée qui transforme ce qu’un Conseiller Client sait en quelque chose qu’un Client ressent. Dès que les interactions deviennent mécaniques, ce n’est plus du clienteling.</span>
  adoption_title: L’adoption compte plus que les outils
  adoption_body: |-
    Une stratégie ou une technologie ne crée de la valeur que lorsque les équipes lui font
    confiance et choisissent de l’utiliser. La confiance se mérite, l’utilité se démontre.
    Les Conseillers Clients sont des Clients de première ligne et des collaborateurs
    essentiels.
  ai_title: L’IA doit amplifier les relations humaines
  ai_body: |-
    L’authenticité est un avantage humain, elle ne peut pas être automatisée. La
    confiance, l’empathie et le jugement se construisent dans l’instant, à travers le ton
    et la présence. J’utilise l’IA pour réduire les frictions, afin que chacun puisse être
    plus pertinent, plus cohérent et plus humain, à grande échelle.
  governance_title: La gouvernance crée de l’élan
  governance_body: |-
    Des responsabilités claires, une cadence régulière et des priorités créent
    l’alignement, accélèrent les décisions et permettent le passage à l’échelle.
  taste_title: Le goût est un avantage stratégique
  taste_body: |-
    Le discernement et la conscience culturelle façonnent les interactions en quelque
    chose de précieux et mémorable.
