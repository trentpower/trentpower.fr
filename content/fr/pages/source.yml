      Miroirs lisibles des principales pages publiques, servis en texte brut afin que les
      octets puissent être inspectés sans exécution.
    trust-records: |-
      Engagements publics et surfaces d'identité. Qui publie le site, ce qui est promis, où
      passent les signalements.
    scripts: |-
      Feuilles de style et JavaScript écrits à la source que la page envoie au navigateur.
      Miroirs de la source, non des octets minifiés déployés.
