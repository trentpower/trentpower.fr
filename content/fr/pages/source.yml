  heading: <span class="hero-line">Chaque octet public,</span><span class="hero-line">en texte clair.</span>
  intro_lede: |-
    Fichiers publics sélectionnés, publiés sous forme lisible. Pour inspection,
    conservation et lecture machine. C’est le miroir lisible du site, et non l’autorité
    cryptographique — celle-ci est Intégrité.
  curation_note: |-
    Cet index présente les principaux miroirs publics. D’autres fichiers miroirs peuvent
    rester accessibles par URL directe lorsqu’ils soutiennent la vérification, la
    récupération ou l’intégrité des versions publiées.
