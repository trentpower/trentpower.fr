privacy:
  page_title: Confidentialité & confiance
  page_kicker: Confidentialité & confiance
  page_h1: <span class="hero-line">Rien n’est suivi.</span><span class="hero-line">Rien à supprimer.</span>
  body_intro: |-
    Ce site ne suit pas les visiteurs. Aucune analytique, aucun cookie, aucun outil de
    profilage, aucun service tiers ne fonctionne en arrière-plan.
  docs_note: |-
    Une description technique complète de l’architecture, de la confidentialité,
    du modèle de vérification et du processus de publication est disponible dans la
    <a href="/documentation/README.pdf">documentation publique</a>.
  body_detail: |-
    Aucune donnée personnelle n’est collectée. Le serveur ne traite que ce qui est
    nécessaire pour assurer la sécurité et le bon fonctionnement du site. Les liens
    externes sont de simples références et n’effectuent aucune requête externe avant
    d’être ouverts. <a class="invite-link" href="/local/">Le stockage navigateur est
    local à votre appareil</a> ; il couvre les préférences (langue, apparence), le
    marqueur de première visite qui retire la mention de traduction automatique une
    fois vue, et les horodatages d’installation
    du service worker indiquant uniquement quand le cache hors-ligne a été rafraîchi.
    Ce stockage local n’est jamais envoyé ailleurs.
  body_records: Les registres d’inspection publique et de vérification sont publiés séparément. Vous pouvez consulter le <a href="/security/" aria-describedby="desc-security-threat-model">Modèle de sécurité et de menaces</a> pour la posture complète.
