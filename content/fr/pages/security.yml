acknowledgments:
  page_title: Remerciements de sécurité
  body_intro: |-
    Cette page recense les divulgations de sécurité responsables qui ont été vérifiées et
    résolues.
  none: |-
    Il n’y a pas de mentions pour le moment. Cela reflète l’absence de divulgations
    signalables à ce jour, et non l’absence de révision ou de maintenance.
  report: |-
    Si vous pensez avoir trouvé un problème de sécurité sur ce site, veuillez le signaler
    de manière responsable. Les coordonnées et les préférences de divulgation sont
    indiquées dans security.txt.
