footer:
  privacy: Confidentialité
  lang_toggle: EN
  location: Paris, France
  verify: Vérifier
  theme:
    light: Clair
    auto: Auto
    dark: Sombre
  proof:
    edition: Édition
    signed: Signée
    manifest_link: Manifeste d'intégrité
    # phase 93 · refonte de la hiérarchie de confiance. le lien d'édition
    # du colophon est le point de confiance principal du pied de page sur
    # chaque page ; il mène désormais au hub /verifier/ destiné au lecteur
    # plutôt qu'à l'archive technique /integrite/ (qui reste accessible
    # comme référence secondaire depuis le panneau "fiches liées" de
    # /verifier/).
    manifest_link_href: /fr/verifier/
    sha_label: SHA-256
    published_today: Publiée aujourd'hui
    # phase 94 · le rendu fr porte une divulgation de traduction
    # automatique (italique serif) au-dessus de la ligne d'édition.
    # phase 94b · la divulgation est un signal de première visite :
    # les deux éléments sont rendus côté serveur dans le html, mais
    # edition.js consulte localStorage['tp-fr-disclosure-seen'] et
    # bascule la visibilité — première visite : disclosure visible,
    # date masquée ; visites suivantes : disclosure retirée, ligne
    # "publiée aujourd'hui / hier / il y a n jours" rétablie.
    # sans javascript, la disclosure reste visible à chaque visite —
    # erreur du bon côté (divulgation par défaut).
    colophon_note_html: '<em class="site-footer__translation-inline" data-translation-disclosure>Ceci est un rendu machine. <a href="/en-au/">L''édition de l''auteur est en anglais</a>.</em><span class="site-footer__colophon-note" data-edition-age hidden>Publiée aujourd''hui</span>'
    aria_label: Vérification de la publication
    last_verified: Vérifié
    sha_title: Ouvrir le dossier de vérification de cette édition
    machine_note: Vérifié par rapport à la version publiée
    machine_note_href: /fr/verifier/
    relative:
      today: aujourd'hui
      yesterday: hier
      days: il y a {n} jours
      months: il y a {n} mois
      years: il y a {n} ans
  provenance:
    line: Traduction automatique de l’édition anglaise originale.
