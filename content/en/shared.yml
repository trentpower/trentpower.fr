footer:
  privacy: Privacy
  lang_toggle: FR
  location: Paris, France
  verify: Verify
  theme:
    light: Light
    auto: Auto
    dark: Dark
  proof:
    edition: Edition
    signed: Signed
    manifest_link: Integrity manifest
    # phase 93 · trust-hierarchy refactor. the colophon edition link is
    # the footer's primary trust destination on every page; it now leads
    # to the user-facing /verify/ hub rather than the technical
    # /integrity/ archive (which remains reachable as a secondary
    # reference from the /verify/ page's related-records panel).
    manifest_link_href: /en-au/verify/
    sha_label: SHA-256
    published_today: Published today
    # phase 94 · the colophon-note element is content-driven so the fr
    # rendering can carry the machine-translation disclosure inline
    # (italic serif, no data-edition-age hook) while the en rendering
    # keeps the data-edition-age hook so edition.js can update the
    # "published today" / "yesterday" / "n days ago" text at runtime.
    colophon_note_html: '<span class="site-footer__colophon-note" data-edition-age>Published today</span>'
    aria_label: Publication verification
    last_verified: Verified
    sha_title: Open the verification record for this edition
    machine_note: Verified against release
    machine_note_href: /en-au/verify/
    relative:
      today: today
      yesterday: yesterday
      days: '{n} days ago'
      months: '{n} months ago'
      years: '{n} years ago'
  provenance:
    line: Author's English edition.
