construction_rail:
  # global construction-rail label · rendered by render_pages.py into
  # every public page just before </body>. uppercase styling is applied
  # by .construction-rail__label CSS (text-transform: uppercase). the
  # phrase "under construction" stays consistent across editions as an
  # archival web artefact; the french rendering uses "en construction"
  # because the existing language-gate convention already established
  # a translated form, and dropping it now would feel less authored.
  label: Under Construction
