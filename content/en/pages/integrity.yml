  direction_c:
    hero:
      kicker: Releases
      line_1: Frozen.
      line_2: Signed.
      line_3: Inspectable.
      lede: A signed snapshot is kept for every edition of the publication. This is the edition history; the live signing authority lives at Integrity. Each release is a complete archive of the site at the time it was published, with an aggregated SHA-256 manifest and detached PGP signature so the contents can be inspected — independently, on your own machine, without trust in this server.
