hero:
  statement: Client strategy,<br><mark>growth systems</mark><br>and cultural adoption<br>at global scale.
  body: |-
    I lead client strategy at Group level, focusing on the systems, governance, and ways
    of working that turn client relationships into long-term value. My work sits at the
    intersection of strategy, technology, and human relationships, with a focus on impact
    that scales and endures.
approach:
  label: Approach
  growth_title: Client growth takes discipline
  growth_body: Lasting growth follows when elegant systems are in place.
  clienteling_title: Clienteling converts transaction into meaning
  clienteling_detail: '<dfn id="clienteling-definition" itemprop="name">Clienteling</dfn><meta itemprop="url" content="https://trentpower.fr/en-au/#clienteling-definition"> <span itemprop="description">is the disciplined practice of transforming what a Client Advisor knows into something a Client feels. The moment interactions become mechanical, it stops being Clienteling.</span>'
  adoption_title: Adoption matters more than tools
  adoption_body: |-
    A strategy or technology only creates value when teams trust it and choose to use it.
    Trust must be earned, and utility must be proven. Client Advisors are first-line
    Clients and vital collaborators.
  ai_title: AI should amplify human relationships
  ai_body: |-
    Authenticity is a human advantage, and it cannot be automated. Trust, empathy, and
    judgement are built in the moment through tone and presence. I use AI to remove
    friction so people can show up more relevant, more consistent and more human, at
    scale.
  governance_title: Governance creates momentum
  governance_body: |-
    Clear ownership, cadence, and priorities create alignment, accelerate decisions, and
    enable scale.
  taste_title: Taste is a strategic advantage
  taste_body: Discernment, and cultural awareness shape interactions into something valuable and memorable.
