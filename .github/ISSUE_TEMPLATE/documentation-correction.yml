name: Documentation correction
description: A factual error or stale claim in the README, docs or published prose.
title: "[docs] "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File path or page URL
      placeholder: "e.g. docs/TRUST-AND-VERIFICATION.md or https://trentpower.fr/en-au/integrity/"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
      description: Quote the passage as it reads today.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed correction
      description: What it should say, and why if not obvious.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English (en-au)
        - French (fr)
        - Both
        - Not language-specific
    validations:
      required: true
