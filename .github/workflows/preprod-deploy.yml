name: Deploy preprod

# Triggers on every push to preprod (normally a feature-PR merge).
#
# Verifies the committed bytes exactly like the production deploy, then
# mirrors public/ to the STAGING host using the SFTP_PREPROD_* secrets from
# the `preproduction` environment. Until that environment has credentials,
# the deploy steps skip cleanly with a notice — verification still runs, so
# preprod merges are always checked even before a staging host exists.
#
# Required `preproduction` environment secrets (once staging exists):
#   SFTP_PREPROD_HOST          the staging SFTP endpoint hostname
#   SFTP_PREPROD_USERNAME      the staging SFTP user
#   SFTP_PREPROD_PASSWORD      the staging SFTP password
#   SFTP_PREPROD_REMOTE_PATH   the web-root path on the staging host
#   SFTP_PREPROD_KNOWN_HOSTS   optional host-key pinning (see deploy.yml)
# Required `preproduction` environment variable:
#   PREPROD_BASE_URL           e.g. https://preprod.trentpower.fr
#
# IMPORTANT — noindex is server config, not repo bytes. The deployed bytes
# are production's signed bytes (robots.txt and .htaccess cannot differ per
# target without breaking the signed integrity manifest), so the staging
# vhost MUST send `X-Robots-Tag: noindex, nofollow` on every response. The
# smoke test below fails loudly if staging is indexable.
# See docs/BUILD-AND-DEPLOYMENT.md.

on:
  push:
    branches:
      - preprod

permissions:
  contents: read

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preproduction
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install lftp + gpg + python + Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp gnupg python3 python3-pil python3-pip
          # see deploy.yml for why jsonschema + pymupdf come from pip.
          python3 -m pip install --break-system-packages --quiet "jsonschema>=4.18" pymupdf

      - name: Verify integrity.json signature against committed PGP key (isolated keyring)
        run: |
          set -eu
          # seed a throwaway keyring with ONLY the published key, never the
          # runner's ambient gpg keyring. persist GNUPGHOME via $GITHUB_ENV so
          # the post-deploy smoke test re-verifies the live signature in the
          # same isolated keyring. mirrors tools/quality/inline_checks.py:check_gpg.
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --quiet --import public/.well-known/pgp-key.asc
          gpg --batch --verify public/integrity.json.sig public/integrity.json

      - name: Restore licensed font binaries (verified against signed manifest)
        run: python3 tools/build/fetch_licensed_fonts.py

      - name: Read-only release sanity check
        run: python3 tools/verify/validate_release.py

      - name: Check staging credentials
        id: staging
        env:
          PRESENT: ${{ secrets.SFTP_PREPROD_HOST != '' && secrets.SFTP_PREPROD_PASSWORD != '' }}
        run: |
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$PRESENT" != "true" ]; then
            echo "::notice::SFTP_PREPROD_* secrets not configured in the 'preproduction' environment — verification passed, staging deploy skipped."
          fi

      - name: SFTP mirror public/ to staging
        if: steps.staging.outputs.present == 'true'
        env:
          SFTP_HOST: ${{ secrets.SFTP_PREPROD_HOST }}
          SFTP_USER: ${{ secrets.SFTP_PREPROD_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PREPROD_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_PREPROD_REMOTE_PATH }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_PREPROD_KNOWN_HOSTS }}
        run: |
          set -eu
          # host-key pinning (conditional) — same contract as deploy.yml.
          SSH_BASE="-a -x -o PubkeyAuthentication=no -o PreferredAuthentications=password"
          if [ -n "${SFTP_KNOWN_HOSTS:-}" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            SSH_OPTS="$SSH_BASE -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
            echo "host-key pinning: ENABLED (StrictHostKeyChecking=yes)"
          else
            SSH_OPTS="$SSH_BASE -o StrictHostKeyChecking=no"
            echo "::warning::SFTP_PREPROD_KNOWN_HOSTS not set — host key NOT pinned (StrictHostKeyChecking=no)."
          fi
          # two-pass mirror (assets first, then html) — same rationale as
          # deploy.yml: never let html name a ?v= url before its bytes exist.
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh $SSH_OPTS"
          set net:max-retries 3
          set net:reconnect-interval-base 4
          cd "$SFTP_REMOTE_DIR"
          lcd public
          # pass 1 — assets (everything except *.html)
          mirror -R --verbose=1 --parallel=4 --no-perms \
            --exclude-glob '.git*' \
            --exclude-glob '__pycache__/' \
            --exclude-glob '*.py' \
            --exclude-glob '*.pyc' \
            --exclude-glob '*.template.js' \
            --exclude-glob 'scripts/' \
            --exclude-glob 'docs/' \
            --exclude-glob 'private/' \
            --exclude-glob 'ZIP/' \
            --exclude-glob 'htdocs/' \
            --exclude-glob '_audit*' \
            --exclude-glob '_rollback*' \
            --exclude-glob '_archives*' \
            --exclude-glob '_licences*' \
            --exclude-glob 'identity_canonical.json' \
            --exclude '^README\.txt$' \
            --exclude-glob '*.md' \
            --exclude-glob 'Klim*' \
            --exclude-glob '.user.ini' \
            --exclude-glob '.DS_Store' \
            --exclude-glob '*.bak' \
            --exclude-glob '*.old' \
            --exclude-glob '*.orig' \
            --exclude-glob '*.html' \
            . .
          # pass 2 — every remaining file (in practice, only *.html).
          mirror -R --verbose=1 --parallel=4 --no-perms \
            --exclude-glob '.git*' \
            --exclude-glob '__pycache__/' \
            --exclude-glob '*.py' \
            --exclude-glob '*.pyc' \
            --exclude-glob '*.template.js' \
            --exclude-glob 'scripts/' \
            --exclude-glob 'docs/' \
            --exclude-glob 'private/' \
            --exclude-glob 'ZIP/' \
            --exclude-glob 'htdocs/' \
            --exclude-glob '_audit*' \
            --exclude-glob '_rollback*' \
            --exclude-glob '_archives*' \
            --exclude-glob '_licences*' \
            --exclude-glob 'identity_canonical.json' \
            --exclude '^README\.txt$' \
            --exclude-glob '*.md' \
            --exclude-glob 'Klim*' \
            --exclude-glob '.user.ini' \
            --exclude-glob '.DS_Store' \
            --exclude-glob '*.bak' \
            --exclude-glob '*.old' \
            --exclude-glob '*.orig' \
            . .
          bye
          EOF

      - name: Staging smoke test (routes + signature + noindex)
        if: steps.staging.outputs.present == 'true'
        env:
          BASE_URL: ${{ vars.PREPROD_BASE_URL }}
        run: |
          set -eu
          if [ -z "${BASE_URL:-}" ]; then
            echo "FAIL: PREPROD_BASE_URL environment variable not set on the preproduction environment"
            exit 1
          fi
          sleep 15
          fail=0

          ok_routes=(
            /
            /en-au/
            /fr/
            /en-au/verify/
            /fr/verifier/
            /integrity.json
            /integrity.json.sig
            /.well-known/security.txt
            /robots.txt
          )
          for path in "${ok_routes[@]}"; do
            code=$(curl -sk -o /dev/null -w "%{http_code}" "$BASE_URL$path")
            if [ "$code" = "200" ]; then
              printf "  %s  %s\n" "$code" "$path"
            else
              printf "  %s  %s  ← EXPECTED 200\n" "$code" "$path"
              fail=1
            fi
          done

          # staging must never be indexable: the vhost (not the repo bytes)
          # has to send X-Robots-Tag noindex. fail loudly otherwise.
          xrt=$(curl -ski "$BASE_URL/" | awk 'BEGIN{IGNORECASE=1} { sub(/\r$/,"") } tolower($1)=="x-robots-tag:"{ v=$0; sub(/^[^:]+: /,"",v) } END{ if (v!="") print v }')
          case "$xrt" in
            *noindex*) echo "  OK    X-Robots-Tag noindex present" ;;
            *) echo "  FAIL  staging is INDEXABLE (X-Robots-Tag='$xrt') — configure the staging vhost"; fail=1 ;;
          esac

          # re-verify the live integrity.json signature in the same isolated
          # keyring seeded earlier (GNUPGHOME persisted via GITHUB_ENV).
          integrity_ok=0
          for attempt in 1 2 3 4 5; do
            cb="$(date +%s%N)"
            curl -sk -H 'Cache-Control: no-cache' -o /tmp/live-integrity.json "$BASE_URL/integrity.json?cb=$cb"
            curl -sk -H 'Cache-Control: no-cache' -o /tmp/live-integrity.json.sig "$BASE_URL/integrity.json.sig?cb=$cb"
            if gpg --verify /tmp/live-integrity.json.sig /tmp/live-integrity.json 2>/tmp/gpg.err; then
              echo "  OK    live integrity.json signature reverifies (attempt $attempt)"
              integrity_ok=1
              break
            fi
            echo "  attempt $attempt: live integrity.json signature did not verify, retrying in 10s"
            sleep 10
          done
          if [ "$integrity_ok" -ne 1 ]; then
            echo "  FAIL  live integrity.json signature does not verify after 5 attempts"
            cat /tmp/gpg.err || true
            fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "staging smoke test failed"; exit 1; }
          echo "OK: staging deploy + smoke test green"
