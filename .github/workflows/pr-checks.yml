name: PR checks

# Runs on every pull request into preprod or main.
#
# The promotion model (feature/* -> preprod -> main) verifies the SAME
# committed bytes at every hop: `release-gate` runs the full blocking gate
# via tools/verify/validate_release.py — byte-for-byte identical to what the
# production deploy verifies — so a PR that passes here cannot fail the
# deploy-time check. Signing stays local: CI verifies the committed
# integrity.json signature against the committed public key; the PGP private
# key never enters GitHub.
#
# Notes:
#   - fetch_licensed_fonts.py needs outbound HTTPS to the live site only
#     (no secrets). A PR introducing NEW font binaries fails until those
#     bytes are live — upload them out-of-band first.
#   - The verification_map_dates check has a 14-day freshness window: a PR
#     older than two weeks needs a local rebuild + re-sign.

on:
  pull_request:
    branches:
      - preprod
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    # blocking — required status check on preprod and main rulesets.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install gpg + python + Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg python3 python3-pil python3-pip
          # the content_schemas blocking gate needs jsonschema>=4.18 (the
          # `referencing` split); ubuntu's apt python3-jsonschema is older, so
          # install via pip. --break-system-packages is required on the
          # externally-managed runner python. pymupdf (fitz) backs the
          # `documentation` blocking gate (README.pdf layout + claim audit).
          # hash-pinned via .github/requirements/ (dependabot regenerates).
          python3 -m pip install --break-system-packages --quiet --require-hashes -r .github/requirements/release-gate.txt

      - name: Restore licensed font binaries (verified against signed manifest)
        # the klim fonts are deliberately untracked (licence prohibits
        # redistribution; see metadata/repo-exclusions.json). a fresh
        # checkout fetches them from the live host and verifies every byte
        # against the SRI digest in the signed integrity.json — fail-closed.
        run: python3 tools/build/fetch_licensed_fonts.py

      - name: Full release gate (blocking checks + signature verify)
        run: python3 tools/verify/validate_release.py

  secret-scan:
    # blocking — required status check on preprod and main rulesets.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — the scan walks every commit)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Scan git history for secrets (strict)
        run: python3 tools/verify/scan_git_history.py --strict

      - name: Repository hygiene scan
        run: python3 tools/quality/validate_repository_hygiene.py

  quality-lint:
    # advisory quality / editorial lint — surfaced in the run summary,
    # never blocks the PR (not a required status check).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install python + Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pil
      - name: Advisory quality lint (non-blocking)
        run: python3 tools/quality/lint.py --format markdown >> "$GITHUB_STEP_SUMMARY" || true

  source-quality:
    # enforced source format + correctness lint (ruff/shellcheck/shfmt/eslint/
    # stylelint/prettier) plus the unit + property test suite. the source
    # reached zero findings, so quality.sh now runs in QUALITY_ENFORCE=1
    # mode and findings fail the job (see docs/GATES-CHECKS-AND-QUALITY.md).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install native tools (ruff, shellcheck, shfmt)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # ruff arrives hash-pinned via pip (replaces the unpinned
          # astral.sh curl|sh installer); hypothesis backs the fuzz tests.
          python3 -m pip install --break-system-packages --quiet --require-hashes -r .github/requirements/source-quality.txt
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          # checksum from the v3.10.0 release sha256sums.txt — fail closed.
          echo "1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc  $HOME/.local/bin/shfmt" | sha256sum -c -
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Node dev tools
        run: npm ci
      - name: Unit + property-based tests (hypothesis fuzz)
        run: python3 -m unittest discover -s tools/quality/tests -p 'test_*.py' -v
      - name: Source quality (enforced)
        env:
          QUALITY_ENFORCE: '1'
        run: bash tools/quality/quality.sh --check

  sca:
    # blocking — dependency vulnerability scan (osv-scanner, OSV.dev) over the
    # pinned Python and Node manifests. Fail-closed. Honours osv-scanner.toml,
    # whose suppressions are tied to security/openvex.json (no silent ignores).
    # NOT yet a required status check — add it in the ruleset once green on a
    # promotion PR (see docs/github-rulesets.md, same merge-first-then-require
    # order as the existing checks).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install osv-scanner (pinned binary, checksum-verified)
        run: |
          set -eu
          ver="2.3.8"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${ver}/osv-scanner_linux_amd64"
          # checksum from the v2.3.8 release osv-scanner_SHA256SUMS — fail closed.
          echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  $HOME/.local/bin/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan dependencies for known vulnerabilities (fail-closed)
        run: osv-scanner scan source --recursive --config=osv-scanner.toml .
