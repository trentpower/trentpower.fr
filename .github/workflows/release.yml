name: Release provenance

# Attaches a GitHub build-provenance attestation to a published edition and
# cuts the GitHub Release that points at it.
#
# Trust model (see docs/ASSURANCE-CASE.md). Editions are built and PGP-signed
# locally; GitHub verifies and conveys, it never builds or signs the canonical
# record. This workflow keeps that boundary: it does NOT rebuild the site. It
# verifies the committed, already-signed release with the full blocking gate,
# then asks GitHub to attest the exact artefact bytes that were published.
#
# What the attestation proves, that PGP alone does not: which commit, and which
# workflow run, produced these artefact digests. actions/attest-build-provenance
# signs keyless via Sigstore (GitHub OIDC) and records the attestation in the
# public Rekor transparency log. A reader verifies it offline-of-our-host with:
#
#   gh attestation verify trentpower-fr-<edition>.tar.gz \
#     --repo trentpower/trentpower.fr
#
# This is release/publish provenance, not a hermetic in-CI rebuild. Upgrading to
# a CI rebuild (full SLSA build-track Level 3) is documented in docs/provenance.md.
#
# Trigger: pushing a signed tag of the form edition/YYYY-MM-DD.
#   git tag -s edition/2026-06-10 -m "Edition 2026-06-10" <commit-on-main>
#   git push origin edition/2026-06-10
#
# Prerequisites (one-off, by hand):
#   - This workflow must already be on main (tag events run the workflow as it
#     exists in the tagged commit).
#   - Apply the protect-release-tags ruleset (admin-only edition/* creation;
#     no updates, no deletions). See docs/github-rulesets.md.

on:
  push:
    tags:
      - 'edition/*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest-and-release:
    if: startsWith(github.ref, 'refs/tags/edition/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for keyless Sigstore signing of the attestation
      attestations: write # write the provenance attestation to the repo store
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve edition from the tag
        run: |
          set -eu
          edition="${GITHUB_REF_NAME#edition/}"
          case "$edition" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) : ;;
            *) echo "::error::tag '$GITHUB_REF_NAME' is not edition/YYYY-MM-DD"; exit 1 ;;
          esac
          dir="public/integrity/releases/$edition"
          [ -d "$dir" ] || { echo "::error::no release directory $dir at this commit"; exit 1; }
          {
            echo "EDITION=$edition"
            echo "RELEASE_DIR=$dir"
          } >> "$GITHUB_ENV"

      - name: Install gpg + python + Pillow (for the blocking gate)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg python3 python3-pil python3-pip
          # mirrors pr-checks.yml: jsonschema>=4.18 + pymupdf back blocking
          # gates; hash-pinned, dependabot regenerates the set.
          python3 -m pip install --break-system-packages --quiet --require-hashes -r .github/requirements/release-gate.txt

      - name: Restore licensed font binaries (verified against signed manifest)
        # klim fonts are untracked (licence); fetched from the live host and
        # verified byte-for-byte against the signed integrity.json. Fail-closed.
        run: python3 tools/build/fetch_licensed_fonts.py

      - name: Full release gate (blocking checks + signature verify)
        # Only a gate-clean, PGP-signed release is ever attested.
        run: python3 tools/verify/validate_release.py

      - name: Attest build provenance for the published artefacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            public/integrity.json
            ${{ env.RELEASE_DIR }}/trentpower-fr-${{ env.EDITION }}.tar.gz
            ${{ env.RELEASE_DIR }}/trentpower-fr-${{ env.EDITION }}.zip
            ${{ env.RELEASE_DIR }}/SHA256SUMS

      - name: Publish the GitHub Release (a pointer, never the canonical record)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes="$(cat <<EOF
          Edition ${EDITION}.

          Source commit: ${GITHUB_SHA}
          Release tag: ${GITHUB_REF_NAME}

          The canonical record is the signed integrity manifest on the site and in
          the repository (public/integrity.json + .sig), verified against the
          published PGP key. These Release assets are convenience copies.

          A GitHub build-provenance attestation covers the archive, the checksums
          and the integrity manifest. Verify it independently:

              gh attestation verify trentpower-fr-${EDITION}.tar.gz \\
                --repo ${GITHUB_REPOSITORY}

          See https://trentpower.fr/en-au/verify/ and docs/provenance.md.
          EOF
          )"
          # Attach only the canonical edition artefacts that exist at this commit.
          files=""
          for f in \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.tar.gz" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.tar.gz.sig" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.tar.gz.sha256" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.zip" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.zip.sig" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.zip.sha256" \
            "${RELEASE_DIR}/SHA256SUMS" \
            "${RELEASE_DIR}/SHA256SUMS.sig" \
            "public/integrity.json" \
            "public/integrity.json.sig"; do
            [ -f "$f" ] && files="$files $f"
          done
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Edition ${EDITION}" \
            --notes "${notes}" \
            --verify-tag \
            $files
