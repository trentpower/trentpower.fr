name: Release provenance

# Builds the release archive ON the GitHub Actions platform and attests it, so a
# consumer can prove which commit and which workflow produced the bytes — SLSA
# build-track Level 3 provenance.
#
# Trust model (see docs/ASSURANCE-CASE.md). The canonical record stays
# locally built and PGP-signed: public/integrity.json + .sig and the canonical
# per-edition archive under public/integrity/releases/<edition>/ are the
# editorial identity anchor, and the signing key never enters CI. This workflow
# adds a second, complementary anchor: it re-renders the site from source on a
# clean runner (reproducibility proof), builds a deterministic site archive in
# the runner, and attests that runner-built archive keyless via Sigstore (GitHub
# OIDC), recorded in the public Rekor transparency log.
#
# Verify (no trust in our host required):
#   gh attestation verify trentpower-fr-<edition>-site.tar.gz \
#     --repo trentpower/trentpower.fr
#
# Trigger: pushing a signed tag of the form edition/YYYY-MM-DD.
#   git tag -s edition/2026-06-10 -m "Edition 2026-06-10" <commit-on-main>
#   git push origin edition/2026-06-10
#
# Prerequisites (one-off, by hand):
#   - This workflow must already be on main (tag events run the workflow as it
#     exists in the tagged commit).
#   - Apply the protect-release-tags ruleset (admin-only edition/* creation;
#     no updates, no deletions). See docs/GITHUB-RULESETS.md.

on:
  push:
    tags:
      - 'edition/*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-release:
    if: startsWith(github.ref, 'refs/tags/edition/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for keyless Sigstore signing of the attestation
      attestations: write # write the provenance attestation to the repo store
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve edition from the tag
        run: |
          set -eu
          edition="${GITHUB_REF_NAME#edition/}"
          case "$edition" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) : ;;
            *) echo "::error::tag '$GITHUB_REF_NAME' is not edition/YYYY-MM-DD"; exit 1 ;;
          esac
          dir="public/integrity/releases/$edition"
          [ -d "$dir" ] || { echo "::error::no release directory $dir at this commit"; exit 1; }
          {
            echo "EDITION=$edition"
            echo "RELEASE_DIR=$dir"
          } >> "$GITHUB_ENV"

      - name: Install gpg + python + Pillow + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg python3 python3-pil python3-pip
          # build-check.txt is the release-gate set plus the render-only deps
          # (pyyaml, fonttools, segno); hash-pinned, dependabot regenerates it.
          python3 -m pip install --break-system-packages --quiet --require-hashes -r .github/requirements/build-check.txt

      - name: Restore licensed font binaries (verified against signed manifest)
        # klim fonts are untracked (licence); fetched from the live host and
        # verified byte-for-byte against the signed integrity.json. Fail-closed.
        run: python3 tools/build/fetch_licensed_fonts.py

      - name: Verify the committed, signed edition (blocking gate + signature)
        # Only a gate-clean, PGP-signed edition is ever built and attested.
        run: python3 tools/verify/validate_release.py

      - name: Re-render the site from source in the runner (reproducibility proof)
        # Proves the committed public/ bytes rebuild from content/ sources on a
        # clean hosted runner. The drift gate inside --check fails closed on any
        # hand-edited generated file. This is the "built from source" half of the
        # SLSA build step; signing stays local, so --check uses --skip-signature.
        run: bash tools/build/build.sh --check

      - name: Restore the committed, signed bytes
        # --check may re-stamp date fields and emit untracked parallel-rebuild
        # artefacts; restore the verified committed tree AND drop any untracked
        # re-render output (gitignored fonts are kept) so the attested site archive
        # is byte-for-byte the committed edition and nothing the runner improvised.
        run: |
          set -eu
          git checkout -- public/
          git clean -fdq public/

      - name: Build the release archive in the runner (the SLSA build step)
        run: |
          set -eu
          out="trentpower-fr-${EDITION}-site.tar.gz"
          # Deterministic: sorted names, zeroed owner/group, mtime pinned to the
          # edition, gzip header without name/mtime. Excludes the nested frozen
          # release archives and the proprietary (Klim) fonts, mirroring the
          # canonical archive's redistribution policy.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="${EDITION}T00:00:00Z" \
            --exclude=./integrity/releases --exclude='*.woff2' \
            -C public -cf - . | gzip -n -9 >"$out"
          sha256sum "$out" | tee "${out}.sha256"
          echo "SITE_ARCHIVE=$out" >>"$GITHUB_ENV"

      - name: Generate the build-toolchain SBOM (CycloneDX)
        run: |
          set -eu
          # The static site ships no runtime dependencies; this SBOM records the
          # Python toolchain that renders and seals the site (the hash-pinned
          # build-check set). --output-reproducible drops the timestamp/serial so
          # the document is byte-deterministic and attestable.
          python3 -m pip install --break-system-packages --quiet --require-hashes -r .github/requirements/sbom.txt
          sbom="trentpower-fr-${EDITION}-sbom.cdx.json"
          python3 -m cyclonedx_py requirements .github/requirements/build-check.txt \
            --output-reproducible --of JSON -o "$sbom"
          sha256sum "$sbom" | tee "${sbom}.sha256"
          echo "SBOM=$sbom" >>"$GITHUB_ENV"

      - name: Validate the SBOM is well-formed CycloneDX (fail closed)
        run: |
          set -eu
          # the SBOM is attached and attested, so an empty or malformed document
          # would silently weaken the release. assert it parses, is CycloneDX,
          # declares a spec version, and lists the build-toolchain components
          # (its own component refs must resolve to the hash-pinned build-check
          # requirements — not invented runtime dependencies). fail closed
          # before the attestation step ever runs.
          python3 - "$SBOM" .github/requirements/build-check.txt <<'PY'
          import json, re, sys
          sbom_path, reqs_path = sys.argv[1], sys.argv[2]
          try:
              doc = json.loads(open(sbom_path, encoding="utf-8").read())
          except (OSError, json.JSONDecodeError) as e:
              sys.exit(f"::error::SBOM is not valid JSON: {e}")
          if doc.get("bomFormat") != "CycloneDX":
              sys.exit(f"::error::SBOM bomFormat is {doc.get('bomFormat')!r}, expected 'CycloneDX'")
          if not doc.get("specVersion"):
              sys.exit("::error::SBOM has no specVersion")
          components = doc.get("components") or []
          if not components:
              sys.exit("::error::SBOM lists no components — it does not represent the build toolchain")
          # the SBOM must describe the build toolchain: every pinned requirement
          # name should appear as a component. this is what makes it a toolchain
          # SBOM rather than a fabricated runtime manifest.
          pinned = set()
          for line in open(reqs_path, encoding="utf-8"):
              m = re.match(r"^([A-Za-z0-9._-]+)\s*==", line.strip())
              if m:
                  pinned.add(m.group(1).lower().replace("_", "-"))
          listed = {(c.get("name") or "").lower().replace("_", "-") for c in components}
          missing = sorted(pinned - listed)
          if missing:
              sys.exit(f"::error::SBOM is missing build-toolchain components: {', '.join(missing)}")
          print(f"SBOM OK: CycloneDX {doc['specVersion']}, {len(components)} component(s), "
                f"all {len(pinned)} pinned toolchain package(s) present.")
          PY

      - name: Attest build provenance (SLSA Build L3 for the runner-built archive)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ env.SITE_ARCHIVE }}
            ${{ env.SBOM }}
            public/integrity.json
            ${{ env.RELEASE_DIR }}/trentpower-fr-${{ env.EDITION }}.tar.gz
            ${{ env.RELEASE_DIR }}/trentpower-fr-${{ env.EDITION }}.zip
            ${{ env.RELEASE_DIR }}/SHA256SUMS

      - name: Publish the GitHub Release (a pointer, never the canonical record)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes="$(cat <<EOF
          Edition ${EDITION}.

          Source commit: ${GITHUB_SHA}
          Release tag: ${GITHUB_REF_NAME}

          The canonical record is the locally built, PGP-signed integrity manifest
          on the site and in the repository (public/integrity.json + .sig), verified
          against the published PGP key.

          trentpower-fr-${EDITION}-site.tar.gz was built in this workflow run from
          the tagged source on a clean GitHub-hosted runner, and carries a SLSA
          build-track Level 3 provenance attestation (keyless Sigstore + Rekor).
          Verify which commit and workflow produced it:

              gh attestation verify trentpower-fr-${EDITION}-site.tar.gz \\
                --repo ${GITHUB_REPOSITORY}

          trentpower-fr-${EDITION}-sbom.cdx.json is a CycloneDX SBOM of the build
          toolchain (the site itself ships no runtime dependencies).

          See https://trentpower.fr/en-au/verify/ and docs/PROVENANCE.md.
          EOF
          )"
          # Attach the runner-built provenance archive plus the canonical,
          # locally-signed edition artefacts that exist at this commit.
          files=""
          for f in \
            "${SITE_ARCHIVE}" \
            "${SITE_ARCHIVE}.sha256" \
            "${SBOM}" \
            "${SBOM}.sha256" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.tar.gz" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.tar.gz.sig" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.tar.gz.sha256" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.zip" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.zip.sig" \
            "${RELEASE_DIR}/trentpower-fr-${EDITION}.zip.sha256" \
            "${RELEASE_DIR}/SHA256SUMS" \
            "${RELEASE_DIR}/SHA256SUMS.sig" \
            "public/integrity.json" \
            "public/integrity.json.sig"; do
            [ -f "$f" ] && files="$files $f"
          done
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Edition ${EDITION}" \
            --notes "${notes}" \
            --verify-tag \
            $files
