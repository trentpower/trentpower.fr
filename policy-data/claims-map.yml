# policy-data/claims-map.yml — the public-promise ledger (policy as data).
#
# This file is the single declarative source the honesty gate reads. It binds
# each public supply-chain claim token to the executable Python control that
# makes the claim true. CONTROL LOGIC STAYS IN PYTHON
# (tools/verify/validate_claims_parity.py) — this file only declares bindings,
# wording, where claims are stated, and the human boundaries around them.
#
# Generated human view: docs/CLAIMS.md (kept in lock-step by the
# claims_map_drift blocking gate). Validated against
# schemas/claims-map.schema.json at load time.
#
# Why no OPA / Conftest / rego / Node: the hard work here is EVIDENCE
# COLLECTION — running gpg, parsing release.yml, checking files on disk. Rego
# can only evaluate data that Python must first collect, so a rule engine would
# add a layer without removing any work. Policy is data (this file); evaluation
# is code (Python). See docs/SECURITY-PIPELINE.md.

# ---------------------------------------------------------------------------
# claim_surface — WHERE the gate looks. The map describes claims; it does not
# decide where the repo is allowed to state them. The scanner walks this wider
# surface (not merely the union of stated_in), so a claim added to an unlisted
# public page is still seen and still must be backed. Each claim's stated_in
# must be a subset of this surface (a claim cannot declare a location the
# scanner does not actually walk).
# ---------------------------------------------------------------------------
claim_surface:
  include:
    - README.md
    - docs/**/*.md
    - content/en/pages/**/*.yml
    - content/fr/pages/**/*.yml
    - public/en-au/**/*.html
    - public/fr/**/*.html
    - docs/pdf/readme.html
  exclude:
    - docs/CLAIMS.md          # generated view of THIS file — never self-scan
    - docs/audits/**          # historical point-in-time records — must not be
                              # re-litigated by today's control set
    - reports/**
    - _archives/**

# ---------------------------------------------------------------------------
# manual_notes — the limits no automated control can close, recorded beside the
# automated ones so the trust story is honest about its boundaries.
# ---------------------------------------------------------------------------
manual_notes:
  - topic: PGP key custody
    note: >-
      The signing key's secrecy is a human responsibility. The gate proves a
      published key exists and that signatures are checked; it cannot prove the
      private key has never left trusted custody.
  - topic: GitHub platform trust
    note: >-
      Attestation, Scorecard, OSV and REUSE controls run on GitHub-hosted
      infrastructure. The claims inherit trust in GitHub's runners and OIDC.
  - topic: SBOM completeness
    note: >-
      The CycloneDX SBOM covers the declared build toolchain. It is validated
      for well-formedness, not asserted to enumerate every transitive input.
  - topic: Static-analysis limits
    note: >-
      CodeQL runs as GitHub default-setup with no committed repo artefact to
      check, so it is deliberately NOT bound to a claim token here — binding it
      would make a future honest CodeQL claim impossible to back. No control
      promises that static analysis finds every class of defect.
  - topic: OSV / REUSE required-status enforcement
    note: >-
      OSV (sca) and REUSE (reuse) are required status checks on both the
      protect-main and protect-preprod rulesets, so a pull request cannot merge
      while either is red. They are enforced at ruleset level (not as a checks.py
      blocking gate), which is why their enforced_at is `ruleset`.
  - topic: Independent reproducibility
    note: >-
      Off-machine, independent bit-for-bit reproduction is a documented target,
      not an achieved guarantee. The build proves zero drift on the build host
      via --check; it does not yet prove a third party reproduces the bytes.

# ---------------------------------------------------------------------------
# claims — one entry per case-sensitive token. Several tokens share one control
# because a single pipeline step earns several claims at once.
# ---------------------------------------------------------------------------
claims:
  SLSA:
    public_wording: "Releases carry SLSA build-track provenance, keyless-signed via Sigstore with a Rekor transparency record."
    severity: critical
    stated_in: [README.md, content/en/pages/security.yml, content/fr/pages/security.yml, docs/PROVENANCE.md]
    verified_by: [control_attestation]
    enforced_at: [release]
    status: enforced
    release_blocking: true
    owner: maintainer
    last_reviewed: "2026-06-18"
    review_cadence: per-release

  Sigstore:
